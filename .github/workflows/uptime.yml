name: Uptime

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Site and API (including the database) answer
        run: |
          set -e
          base=https://smart-rule-based-approval-engine.vercel.app
          curl -fsS -o /dev/null --retry 3 --retry-delay 10 "$base/"
          curl -fsS --retry 3 --retry-delay 10 "$base/api/health" | tee /dev/stderr | grep -q '"database":"ok"'
