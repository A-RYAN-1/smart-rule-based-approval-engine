  /api/admin/rules:
    get:
      tags: [Admin]
      summary: List the approval rules
      responses:
        '200':
          description: All rules
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Rule' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Admin]
      summary: Create a rule
      description: The limit in `condition` may not exceed the grade's own limit.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Rule' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/admin/rules/draft/status:
    get:
      tags: [Admin]
      summary: Is rule drafting switched on
      description: Drafting is on only when the server has a model key.
      responses:
        '200':
          description: The switch
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          enabled: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/admin/rules/draft:
    post:
      tags: [Admin]
      summary: Draft a rule from a sentence
      description: |
        Returns one proposed rule as a before and after. Nothing is saved; the admin confirms by
        posting the rule to `POST /api/admin/rules`. See `docs/rule-drafting.md`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RuleDraftRequest' }
      responses:
        '200':
          description: A draft
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/RuleDraft' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          description: The sentence is unclear, or the value is above the grade limit or not positive
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '429':
          description: The daily drafting limit or the provider quota is used up
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '502':
          description: The model provider failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '503':
          description: Drafting is switched off
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }

