openapi: 3.0.3
info:
  title: Smart Rule-Based Approval Engine API
  version: 1.1.0
  description: |
    REST API of the approval engine. Employees file leave, expense and discount requests; the server
    evaluates each one against the admin-defined rules of the employee's grade and either decides it
    (auto approved or auto rejected) or leaves it pending for a manager or admin.

    **Responses.** Every handler answers with the same envelope:
    `{"success": bool, "message": string, "data": any, "error": any}`. Two things are not in the
    envelope: the authentication middleware answers a missing or bad token with `{"error": "..."}`,
    and the health, cron and demo-login endpoints return their own small bodies.

    **Authentication.** `POST /api/auth/login` returns a JWT in `data.token` and also sets it as the
    `access_token` cookie (one hour). Send it as `Authorization: Bearer <token>` or let the browser
    send the cookie. Roles are `EMPLOYEE`, `MANAGER` and `ADMIN`.

    **Try it.** The demo deployment lists its three demo accounts at `GET /api/demo-logins`.

    This file is checked against the registered routes in CI: a route missing here, or documented
    here and not served, fails the build.

servers:
  - url: https://smart-rule-based-approval-engine.vercel.app
    description: Demo deployment (Vercel)
  - url: http://localhost:8080
    description: Local development

tags:
  - name: Operations
    description: Health, the scheduled job and demo accounts
  - name: Auth
  - name: Leave
  - name: Expense
  - name: Discount
  - name: Requests
    description: All request types in one call
  - name: Balances
  - name: Reports
  - name: Admin
    description: Rules, holidays and reports; admin only

security:
  - BearerAuth: []
  - CookieAuth: []

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    CookieAuth:
      type: apiKey
      in: cookie
      name: access_token
    CronSecret:
      type: http
      scheme: bearer
      description: The value of the CRON_SECRET environment variable

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    Limit:
      name: limit
      in: query
      description: Page size. A value that is not a positive integer falls back to 10.
      schema: { type: integer, default: 10 }
    Offset:
      name: offset
      in: query
      description: Rows to skip. A negative or invalid value falls back to 0.
      schema: { type: integer, default: 0 }

  responses:
    Unauthorized:
      description: No token, or an invalid or expired one. This body comes from the auth middleware, not the envelope.
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string, example: unauthorized }
    Forbidden:
      description: The role may not do this
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
    BadRequest:
      description: Invalid input; `message` says which rule failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
    NotFound:
      description: No such request, rule or holiday
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }

  schemas:
    Envelope:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        data: { nullable: true }
        error: { nullable: true, description: "Extra detail on a failure, or null" }
      required: [success, message, data, error]

    Role:
      type: string
      enum: [EMPLOYEE, MANAGER, ADMIN]

    RequestStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED, CANCELLED, AUTO_APPROVED, AUTO_REJECTED]

    RequestType:
      type: string
      enum: [LEAVE, EXPENSE, DISCOUNT]

    User:
      type: object
      properties:
        id: { type: integer, format: int64, example: 3 }
        name: { type: string, example: Employee }
        email: { type: string, format: email, example: employee@company.com }
        grade_id: { type: integer, format: int64, example: 1 }
        role: { $ref: '#/components/schemas/Role' }
        manager_id: { type: integer, format: int64, nullable: true, example: 2 }
        created_at: { type: string, format: date-time }

    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string, example: Jane Smith }
        email: { type: string, format: email, example: jane@company.com }
        password: { type: string, example: a-long-password }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, example: employee@company.com }
        password: { type: string, example: employee-demo }

    LoginData:
      type: object
      properties:
        token: { type: string, description: "JWT, valid for one hour" }
        user: { $ref: '#/components/schemas/User' }

    LeaveApplyRequest:
      type: object
      required: [from_date, to_date, leave_type, reason]
      properties:
        from_date: { type: string, format: date, example: '2026-12-07' }
        to_date: { type: string, format: date, example: '2026-12-09' }
        leave_type: { type: string, example: CASUAL }
        reason: { type: string, example: Family event }

    ExpenseApplyRequest:
      type: object
      required: [amount, category, reason]
      properties:
        amount: { type: number, example: 4200, description: "Must be greater than zero" }
        category: { type: string, example: TRAVEL, description: "Must not be blank" }
        reason: { type: string, example: Client visit }

    DiscountApplyRequest:
      type: object
      required: [discount_percentage, reason]
      properties:
        discount_percentage: { type: number, example: 8 }
        reason: { type: string, example: Loyalty offer }

    ApplyResult:
      type: object
      description: The decision made on the new request
      properties:
        status: { $ref: '#/components/schemas/RequestStatus' }

    ApproveRequest:
      type: object
      properties:
        comment: { type: string, description: "Optional on approve", example: Approved }

    RejectRequest:
      type: object
      required: [comment]
      properties:
        comment: { type: string, description: "Required on reject", example: Over the team limit }

    LeaveRequestItem:
      type: object
      properties:
        id: { type: integer, format: int64 }
        leave_type: { type: string, example: CASUAL }
        from_date: { type: string, format: date }
        to_date: { type: string, format: date }
        days: { type: integer, description: "Working days (Monday to Friday minus company holidays), fixed when the request is filed" }
        reason: { type: string }
        status: { $ref: '#/components/schemas/RequestStatus' }
        approval_comment: { type: string }
        created_at: { type: string, format: date-time }
        employee: { type: string, description: "Name of the requester; pending lists only" }
        user_id: { type: integer, format: int64, description: "Requester; pending lists only" }

    ExpenseRequestItem:
      type: object
      properties:
        id: { type: integer, format: int64 }
        amount: { type: number }
        category: { type: string, example: TRAVEL }
        reason: { type: string }
        status: { $ref: '#/components/schemas/RequestStatus' }
        approval_comment: { type: string }
        created_at: { type: string, format: date-time }
        employee: { type: string, description: "Pending lists only" }
        user_id: { type: integer, format: int64, description: "Pending lists only" }

    DiscountRequestItem:
      type: object
      properties:
        id: { type: integer, format: int64 }
        discount_percentage: { type: number }
        reason: { type: string }
        status: { $ref: '#/components/schemas/RequestStatus' }
        approval_comment: { type: string }
        created_at: { type: string, format: date-time }
        employee: { type: string, description: "Pending lists only" }
        user_id: { type: integer, format: int64, description: "Pending lists only" }

    LeaveRequestPage:
      type: object
      properties:
        requests:
          type: array
          items: { $ref: '#/components/schemas/LeaveRequestItem' }
        total: { type: integer }

    ExpenseRequestPage:
      type: object
      properties:
        requests:
          type: array
          items: { $ref: '#/components/schemas/ExpenseRequestItem' }
        total: { type: integer }

    DiscountRequestPage:
      type: object
      properties:
        requests:
          type: array
          items: { $ref: '#/components/schemas/DiscountRequestItem' }
        total: { type: integer }

    AllRequests:
      type: object
      description: The three request types side by side
      properties:
        leave_request:
          type: array
          items: { $ref: '#/components/schemas/LeaveRequestItem' }
        expense_request:
          type: array
          items: { $ref: '#/components/schemas/ExpenseRequestItem' }
        discount_request:
          type: array
          items: { $ref: '#/components/schemas/DiscountRequestItem' }
        total: { type: integer, description: "Present on the pending list" }

    Balances:
      type: object
      properties:
        leave:
          type: object
          properties:
            total: { type: integer, example: 45 }
            remaining: { type: integer, example: 33 }
        expense:
          type: object
          properties:
            total: { type: number, example: 50000 }
            remaining: { type: number, example: 42000 }
        discount:
          type: object
          properties:
            total: { type: number, example: 40 }
            remaining: { type: number, example: 40 }

    Rule:
      type: object
      required: [request_type, condition, action, grade_id]
      properties:
        id: { type: integer, format: int64, readOnly: true }
        request_type: { $ref: '#/components/schemas/RequestType' }
        condition:
          type: object
          description: One limit, which must not exceed the grade's own limit. `max_days` for leave, `max_amount` for expense, `max_percent` for discount.
          additionalProperties: { type: number }
          example: { max_amount: 5000 }
        action: { type: string, enum: [AUTO_APPROVE], example: AUTO_APPROVE }
        grade_id: { type: integer, format: int64, example: 1 }
        active: { type: boolean }

    RuleDraftRequest:
      type: object
      required: [sentence]
      properties:
        sentence: { type: string, maxLength: 300, example: grade 2 expenses up to 8k }

    RuleDraft:
      type: object
      description: A proposal. Nothing is saved until the admin posts the rule to `POST /api/admin/rules`.
      properties:
        rule: { $ref: '#/components/schemas/Rule' }
        grade_name: { type: string }
        change:
          type: object
          properties:
            field: { type: string, example: max_amount }
            before: { type: number, nullable: true, description: "Current value, or null when no rule exists yet" }
            after: { type: number }
        prompt_version: { type: string, example: rule-draft-v2 }

    HolidayRequest:
      type: object
      required: [date]
      properties:
        date: { type: string, format: date, example: '2026-12-25' }
        description: { type: string, example: Christmas }

    Holiday:
      type: object
      properties:
        id: { type: integer, format: int64 }
        date: { type: string, format: date }
        description: { type: string }

    StatusDistribution:
      type: object
      properties:
        pending: { type: integer }
        approved: { type: integer }
        rejected: { type: integer }
        cancelled: { type: integer }
        auto_rejected: { type: integer }

    RequestTypeReport:
      type: object
      properties:
        type: { $ref: '#/components/schemas/RequestType' }
        total_requests: { type: integer }
        auto_approved: { type: integer }
        auto_approved_percentage: { type: number }

    DashboardSummary:
      type: object
      properties:
        total_pending: { type: integer }
        pending: { type: integer }
        approved: { type: integer }
        rejected: { type: integer }
        auto_rejected: { type: integer }
        cancelled: { type: integer }
        distribution:
          type: object
          properties:
            pending:
              type: object
              properties:
                leave: { type: integer }
                expense: { type: integer }
                discount: { type: integer }
            approved: { type: integer }
            rejected: { type: integer }
            auto_rejected: { type: integer }
            cancelled: { type: integer }
        type_report:
          type: array
          items: { $ref: '#/components/schemas/RequestTypeReport' }

paths:
  /health:
    get:
      tags: [Operations]
      summary: Liveness and database check
      description: Pings the database with a 3 second limit. Also served at `/api/health`.
      security: []
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema: &healthBody
                type: object
                properties:
                  status: { type: string, enum: [healthy, degraded] }
                  database: { type: string, enum: [ok, unreachable] }
                  timestamp: { type: string, format: date-time }
                  service: { type: string, example: approval-engine }
        '503':
          description: The database is unreachable
          content:
            application/json:
              schema: *healthBody

  /api/health:
    get:
      tags: [Operations]
      summary: Same as /health
      security: []
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema: *healthBody
        '503':
          description: The database is unreachable
          content:
            application/json:
              schema: *healthBody

  /api/cron/auto-reject:
    get:
      tags: [Operations]
      summary: Run the auto-reject job
      description: |
        Rejects pending requests that have waited too long. Called once a day by Vercel Cron, which
        sends `Authorization: Bearer <CRON_SECRET>`. Disabled (always 401) when `CRON_SECRET` is not set.
      security:
        - CronSecret: []
      responses:
        '200':
          description: The job ran
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: done }
        '401':
          description: Wrong or missing secret
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string, example: unauthorized }

  /api/demo-logins:
    get:
      tags: [Operations]
      summary: Demo accounts for the login page
      description: Returns 404 unless the server runs with `DEMO_MODE` on.
      security: []
      responses:
        '200':
          description: The demo accounts
          content:
            application/json:
              schema:
                type: object
                properties:
                  logins:
                    type: array
                    items:
                      type: object
                      properties:
                        role: { $ref: '#/components/schemas/Role' }
                        email: { type: string, format: email }
                        password: { type: string }
        '404':
          description: Demo mode is off
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string, example: not found }

  /api/auth/register:
    post:
      tags: [Auth]
      summary: Create an employee account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Account created. No token is issued; log in next.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: The email is already registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Log in
      description: Returns the JWT in the body and sets it as the `access_token` cookie.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Logged in
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/LoginData' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: Wrong email or password
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Log out
      description: Clears the `access_token` cookie. The JWT itself stays valid until it expires.
      security: []
      responses:
        '200':
          description: Cookie cleared
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }

  /api/me:
    get:
      tags: [Auth]
      summary: The signed-in user
      responses:
        '200':
          description: The user
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/balances:
    get:
      tags: [Balances]
      summary: Remaining leave, expense and discount allowance
      responses:
        '200':
          description: Balances
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Balances' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/leaves/request:
    post:
      tags: [Leave]
      summary: File a leave request
      description: The rules decide it on the spot (`AUTO_APPROVED`, `AUTO_REJECTED`) or leave it `PENDING`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LeaveApplyRequest' }
      responses:
        '200':
          description: Filed; `data.status` is the decision
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ApplyResult' }
        '400':
          description: Bad dates or format, a past date, overlap with an existing request, or more days than the balance holds
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/leave/apply:
    post:
      tags: [Leave]
      summary: Alias of POST /api/leaves/request
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LeaveApplyRequest' }
      responses:
        '200':
          description: Same as `/api/leaves/request`
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ApplyResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/leaves/working-days:
    get:
      tags: [Leave]
      summary: Working days between two dates
      description: Monday to Friday minus the company holidays; the form uses it to show the cost before filing.
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200':
          description: The count
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          days: { type: integer, example: 5 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/leaves/my:
    get:
      tags: [Leave]
      summary: My leave requests
      description: Always the first 10 rows; `limit` and `offset` are not read on this route (use `/api/my-requests?type=LEAVE`).
      responses:
        '200':
          description: My requests, newest first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/LeaveRequestPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/leaves/pending:
    get:
      tags: [Leave]
      summary: Leave requests waiting for me
      description: Managers see their reports' requests; admins see managers' requests and anything unassigned. Employees get 403.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: A page of pending requests
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/LeaveRequestPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/leaves/{id}/cancel:
    post:
      tags: [Leave]
      summary: Cancel my own request
      description: Returns the days to the balance. A finished request cannot be cancelled.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/leaves/{id}/approve:
    post:
      tags: [Leave]
      summary: Approve a pending leave request
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApproveRequest' }
      responses:
        '200':
          description: Approved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/leaves/{id}/reject:
    post:
      tags: [Leave]
      summary: Reject a pending leave request
      description: A comment is required. The days return to the balance.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RejectRequest' }
      responses:
        '200':
          description: Rejected
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/expenses/request:
    post:
      tags: [Expense]
      summary: File an expense request
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExpenseApplyRequest' }
      responses:
        '200':
          description: Filed; `data.status` is the decision
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ApplyResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/expenses/my:
    get:
      tags: [Expense]
      summary: My expense requests
      description: Always the first 10 rows; `limit` and `offset` are not read on this route.
      responses:
        '200':
          description: My requests, newest first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ExpenseRequestPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/expenses/pending:
    get:
      tags: [Expense]
      summary: Expense requests waiting for me
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: A page of pending requests
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ExpenseRequestPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/expenses/{id}/cancel:
    post:
      tags: [Expense]
      summary: Cancel my own request
